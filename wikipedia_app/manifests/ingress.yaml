apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wikipedia-ingress
  namespace: exercises
spec:
  rules:
    - host: wikipedia.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wikipedia-svc
                port:
                  number: 80
