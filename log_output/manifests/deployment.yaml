apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
      containers:
        - name: log-writer
          image: felixwickholm/log-output-writer:1.10
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: log-reader
          image: felixwickholm/log-output-reader:2.1
          env:
            - name: PORT
              value: "3000"
            - name: PINGPONG_URL
              value: http://ping-pong-svc:2345/pings
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
