apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: shared-files
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: log-writer
          image: felixwickholm/log-output-writer:1.10
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: log-reader
          image: felixwickholm/log-output-reader:1.11
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
            - name: shared-files
              mountPath: /usr/src/app/shared
              readOnly: true
