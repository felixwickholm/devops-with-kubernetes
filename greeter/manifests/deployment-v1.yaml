apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: greeter-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v1
  template:
    metadata:
      labels:
        app: greeter
        version: v1
    spec:
      containers:
        - name: greeter
          image: felixwickholm/greeter:5.3
          env:
            - name: PORT
              value: "3000"
            - name: GREETING
              value: "Hello from greeter v1"
