apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-claim
      containers:
        - name: todo-app
          image: felixwickholm/todo-app:2.2
          env:
            - name: PORT
              value: "3001"
            - name: TODO_BACKEND_URL
              value: http://todo-backend-svc:2345/todos
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
