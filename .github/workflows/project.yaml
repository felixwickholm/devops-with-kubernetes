name: Project staging release

on:
  push:
    branches:
      - main
    paths:
      - todo_app/**
      - todo_backend/**
      - broadcaster/**
      - todo_cronjob/**
      - .github/workflows/project.yaml

permissions:
  contents: write

concurrency: project-kustomization

jobs:
  build-publish:
    name: Build, push and update kustomization
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Skip when Docker Hub secrets are missing
        if: env.DOCKERHUB_TOKEN == ''
        run: echo "::notice::Set the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to build images."

      - name: Checkout
        if: env.DOCKERHUB_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Kustomize
        if: env.DOCKERHUB_TOKEN != ''
        uses: imranismail/setup-kustomize@v2

      # Each image is tagged with the commit SHA and built for amd64 and arm64.
      - name: Build and push images, use them in the kustomization
        if: env.DOCKERHUB_TOKEN != ''
        run: |-
          for app in todo_app todo_backend broadcaster todo_cronjob; do
            image="felixwickholm/$(echo $app | tr _ -)"
            docker buildx build --platform linux/amd64,linux/arm64 --tag "$image:$GITHUB_SHA" --push $app
            (cd project/overlays/staging && kustomize edit set image "$image=$image:$GITHUB_SHA")
          done

      - name: Commit the staging kustomization.yaml
        if: env.DOCKERHUB_TOKEN != ''
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/overlays/staging/kustomization.yaml
          git commit -m "Project: staging images $GITHUB_SHA"
          git pull --rebase origin main
          git push origin HEAD:main
