name: Project staging release

# The images are built here. The configuration is in the repository
# felixwickholm/devops-with-kubernetes-config, where this workflow sets the new image tags
# in overlays/staging. ArgoCD deploys that repository.
on:
  push:
    branches:
      - main
    paths:
      - todo_app/**
      - todo_backend/**
      - broadcaster/**
      - todo_cronjob/**
      - .github/workflows/project.yaml

permissions:
  contents: read

concurrency: project-config

jobs:
  build-publish:
    name: Build, push and update the config repository
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
    steps:
      - name: Skip when secrets are missing
        if: env.DOCKERHUB_TOKEN == '' || env.CONFIG_REPO_TOKEN == ''
        run: echo "::notice::Set DOCKERHUB_USERNAME, DOCKERHUB_TOKEN and CONFIG_REPO_TOKEN to build images and update the config repository."

      - name: Checkout code
        if: env.DOCKERHUB_TOKEN != '' && env.CONFIG_REPO_TOKEN != ''
        uses: actions/checkout@v4

      - name: Checkout the config repository
        if: env.DOCKERHUB_TOKEN != '' && env.CONFIG_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: felixwickholm/devops-with-kubernetes-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Set up QEMU
        if: env.DOCKERHUB_TOKEN != '' && env.CONFIG_REPO_TOKEN != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.DOCKERHUB_TOKEN != '' && env.CONFIG_REPO_TOKEN != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && env.CONFIG_REPO_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Kustomize
        if: env.DOCKERHUB_TOKEN != '' && env.CONFIG_REPO_TOKEN != ''
        uses: imranismail/setup-kustomize@v2

      # Each image is tagged with the commit SHA and built for amd64 and arm64.
      - name: Build and push images, set the tags in the config repository
        if: env.DOCKERHUB_TOKEN != '' && env.CONFIG_REPO_TOKEN != ''
        run: |-
          for app in todo_app todo_backend broadcaster todo_cronjob; do
            image="felixwickholm/$(echo $app | tr _ -)"
            docker buildx build --platform linux/amd64,linux/arm64 --tag "$image:$GITHUB_SHA" --push $app
            (cd config/overlays/staging && kustomize edit set image "$image=$image:$GITHUB_SHA")
          done

      - name: Commit to the config repository
        if: env.DOCKERHUB_TOKEN != '' && env.CONFIG_REPO_TOKEN != ''
        working-directory: config
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/staging/kustomization.yaml
          git commit -m "Staging images from code commit $GITHUB_SHA"
          git pull --rebase origin main
          git push origin HEAD:main
