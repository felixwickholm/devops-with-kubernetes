apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: greeter-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
  template:
    metadata:
      labels:
        app: greeter
    spec:
      containers:
        - name: greeter
          image: felixwickholm/greeter:5.3
          env:
            - name: PORT
              value: "3000"
            - name: GREETING
              value: "Hello from greeter v1"
---
apiVersion: v1
kind: Service
metadata:
  namespace: exercises
  name: greeter-svc
spec:
  selector:
    app: greeter
  ports:
    - port: 2345
      targetPort: 3000
