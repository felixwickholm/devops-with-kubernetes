apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: config
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt
      containers:
        - name: log-writer
          image: felixwickholm/log-output-writer:1.10
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        # No readiness probe here: a probe that calls Ping-pong every few seconds would keep it from scaling to zero.
        - name: log-reader
          image: felixwickholm/log-output-reader:5.3
          env:
            - name: PORT
              value: "3000"
            # The fully qualified name of the Knative Service
            - name: PINGPONG_URL
              value: http://ping-pong.exercises.svc.cluster.local/pings
            - name: GREETER_URL
              value: http://greeter-svc.exercises.svc.cluster.local:2345/
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
            - name: config
              mountPath: /usr/src/app/config
              readOnly: true
---
# Without Traefik there is no Ingress controller for normal apps, so Log output uses the NodePort
# that the cluster maps to localhost:8182.
apiVersion: v1
kind: Service
metadata:
  namespace: exercises
  name: log-output-svc
spec:
  type: NodePort
  selector:
    app: log-output
  ports:
    - port: 2345
      protocol: TCP
      targetPort: 3000
      nodePort: 30080
