# The whole project. ArgoCD deploys this directory (../argocd/project.yaml).
# The database Secret is applied outside ArgoCD (SOPS), see ../todo_backend/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../todo_app
  - ../todo_backend
  - ../broadcaster
  - ../todo_cronjob
images:
  - name: felixwickholm/todo-app
    newTag: "4.8"
  - name: felixwickholm/todo-backend
    newTag: "4.6"
  - name: felixwickholm/broadcaster
    newTag: "4.6"
  - name: felixwickholm/todo-cronjob
    newTag: "2.9"
